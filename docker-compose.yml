# 曲泉AI 后端编排：go-backend → agent
#
# ⚠️ 前端**不在**这里。前端是静态产物，由**独立运行的 Nginx 容器**托管
#    （站点配置见 deploy/nginx/colorai.conf，网络接入方式见 README「部署」）。
#
# 网络：本编排创建一个固定名字的网络 `colorai-net`，Nginx 容器以 external 方式接进来，
#       直接用服务名 `go-backend:3001` 访问 —— **不需要**把 3001 暴露到宿主机。
#
# 外部依赖（不在此编排内，需事先就绪）：
#   MySQL / Redis / PostgreSQL+pgvector —— 均已迁至独立数据库机 8.140.227.153
#     （连接参数：DB_* / REDIS_* 在 go-backend/.env，PG_* 在 agent/.env）
#   阿里云 OSS          —— go-backend/.env 的 OSS_*（图片存储）
#   DeepSeek / 硅基流动  —— go-backend/agent/.env 的 DEEPSEEK_* / EMBEDDING_*
#
# 用法：
#   1) 准备好 go-backend/.env 与 go-backend/agent/.env（两份都不进镜像）
#   2) docker-compose up -d --build      # 新版 CLI 也支持 docker compose up -d --build
#   3) docker-compose logs -f

services:
  # ---------------- Go 后端 ----------------
  go-backend:
    # 显式固定镜像名：否则 compose 会按「目录名_服务名」自动命名（colorai_go-backend），
    # 一旦 测试/生产 的部署目录名不同，docker load 进来的镜像就匹配不上。
    image: colorai-go-backend:latest
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    container_name: colorai-go
    env_file:
      - ./go-backend/.env
    environment:
      # ⚠️ 容器里 localhost 指的是容器自己，必须用 compose 的服务名。
      #    刻意**不写进** go-backend/.env —— 那份文件本地开发也在用，
      #    写死服务名会让本地连不上 127.0.0.1:8000。
      AGENT_URL: http://agent:8000

      # ℹ️ 2026-09-30：Redis 已从部署宿主机（WeKnora-redis 容器）迁至独立
      #    数据库机 8.140.227.153 —— 与 MySQL / PostgreSQL 同机，走公网直连。
      #    REDIS_ADDR 不再需要覆盖，.env 里的值就是对的。
      #    （历史：曾因 Redis 跑在宿主机容器里而覆盖成 host.docker.internal，
      #      该结构及配套的 extra_hosts 均已废弃移除。）
    ports:
      # 只绑宿主机回环，**仅供在服务器上 curl 排障**（curl 127.0.0.1:3001/api/health）。
      # Nginx 容器不走这里 —— 它通过 colorai-net 按服务名直连。
      # 写成 "3001:3001" 会监听 0.0.0.0，任何人都能绕过 Nginx 直打后端。
      - "127.0.0.1:3001:3001"
    networks:
      - colorai-net
    depends_on:
      agent:
        # 等 agent 的 healthcheck 通过再启动，避免 Go 刚起来就转发失败
        condition: service_healthy
    restart: unless-stopped

  # ---------------- Python Agent ----------------
  agent:
    # 显式固定镜像名（理由同 go-backend 上方注释）
    image: colorai-agent:latest
    build:
      context: ./go-backend/agent
      dockerfile: Dockerfile
    container_name: colorai-agent
    # 刻意不映射端口：只有 go-backend 需要访问它，走 colorai-net 内网即可。
    # 暴露出去既没用又扩大了攻击面。
    env_file:
      - ./go-backend/agent/.env
    environment:
      # environment 优先级高于 env_file，这里只放需要「按环境覆盖」的项。
      #
      # ⚠️ 不要写 DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}：
      #    宿主 shell 未设置该变量时 Compose 会传入空字符串，
      #    反而盖掉 env_file 里的真 key。
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEBUG: ${DEBUG:-false}

      # ℹ️ 2026-09-29：PostgreSQL 已从部署宿主机（WeKnora-postgres 容器）迁至
      #    独立数据库机 8.140.227.153 —— 与 MySQL / Redis 同机，走公网直连。
      #    PG_HOST 不再需要覆盖：agent/.env 里的值就是对的，**务必不要**
      #    再覆盖成 host.docker.internal（那会连到已退役的旧库）。
      #    该结构及配套的 extra_hosts 均已废弃移除。
    networks:
      - colorai-net
    volumes:
      - ./go-backend/agent/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      # 用 python 而不是 curl：基础镜像 python:3.11-slim 是否自带 curl 未经验证，
      # 不依赖外部命令可以消除这个不确定性。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      # agent 要连 PG 建连接池、加载工具，给足冷启动时间
      start_period: 40s

networks:
  # 固定网络名（而不是默认的 <项目名>_default）：Nginx 容器要以 external 方式
  # 引用它，名字必须稳定、可预测。
  colorai-net:
    name: colorai-net
