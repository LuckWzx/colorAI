# 曲泉AI —— Nginx 站点配置（**独立容器**，不动 blog）
#
# 放置位置：挂载到 colorai-nginx 容器的 /etc/nginx/conf.d/colorai.conf
#   宿主路径：/root/nginx/conf.d-colorai/colorai.conf
#
# 🔴 **注意：不是 `/root/nginx/conf.d/`！** 那个目录是 **blog 容器的**，里面只有
#    `blog-nginx.conf`，我们一个字节都不往里写。两个目录长得很像，别搞混：
#
#      /root/nginx/conf.d/          → 挂进 nginx-container(blog)     → blog-nginx.conf
#      /root/nginx/conf.d-colorai/  → 挂进 colorai-nginx(我们的)     → colorai.conf  ← 就是本文件
#
#    为什么必须分开：`/root/nginx/conf.d` 也挂进了 blog 容器，而本文件同样是
#    `listen 80; server_name wzx.glaty.cn;` —— 放进去就和 `blog-nginx.conf`
#    **撞同名 server_name**，nginx 只取按文件名字母序靠前的那个（`blog-nginx.conf` 在前），
#    我们的块在 blog 容器里变成死配置。分开目录正是「blog 零停机」的来源。
#
#    📌 改配置的正确流程：改**本文件** → `python deploy/nginx_up.py --apply`
#       （只想重载就 `--reload`）。**别直接在服务器上改**，那样会和仓库版本漂移。
#       `python deploy/nginx_up.py --verify` 会把上面两个目录的内容都列出来对照。
#
# ======================== 架构：为什么是独立容器 ========================
#
# ✅ 2026-09-24 定：给 colorAI **单起一个 nginx 容器**（`colorai-nginx`），
#    而不是往现有 blog 容器里塞配置。
#
#    背景：用户只有一个域名 wzx.glaty.cn，已被 blog 占用（80 端口）。blog 前端**也**调
#    `/api`，两个站共用 80 必然抢 `location /api/` → 要么改前端 baseURL（要重新构建），
#    要么 blog 的 /api 被抢走。→ 给 colorAI 单开 **8080**：换 `listen` 端口 = 换 server
#    块 = `/api` 天然隔离，**前端代码零改动**。
#
#    加端口映射必须重建容器（端口不能热加）。这时有两条路：
#
#      ❌ 重建 blog 的 nginx-container（原计划）
#         代价：wzx.glaty.cn 断 2~3 秒；且以后每次改 colorAI 的 nginx 都要再冒一次
#               blog 的风险；重建命令还必须把 blog 的挂载/网络**一条不漏**地复现。
#
#      ✅ 新建独立的 colorai-nginx（现方案）
#         代价：多一个 nginx 进程（实测 ~6MB 内存）。
#         好处：**blog 零停机**；配置目录、内容目录全独立，互不可见；
#               以后改 colorAI 的 nginx（换端口、上 HTTPS、改配置）**完全不影响 blog**；
#               回滚就是 `docker rm -f colorai-nginx`，一行。
#
#    隔离是双向收紧的：
#      * conf：本容器挂的是**只有 colorai.conf 的独立目录** → 看不到 blog-nginx.conf，
#              也就不存在「谁是 default_server」的排序问题。
#      * 内容：只把 `/root/nginx/blog/colorai` 以 **只读** 挂进来 →
#              这个 nginx 连 blog 的文件都看不见，更不可能写坏它们。
#
#    容器内路径映射（见 deploy/nginx_up.py）：
#      宿主 /root/nginx/conf.d-colorai            → /etc/nginx/conf.d      (ro)
#      宿主 /root/nginx/blog/colorai              → /usr/share/nginx/html/colorai  (ro)
#      端口 -p 8080:80        网络 --network colorai-net
#
#    📌 dist 放哪：/root/nginx/blog/colorai/
#       推 dist 用 `python deploy/upload_dist.py`（本机没有 rsync）。
#       它把「安全目标」写成了硬前置条件，四种写错的形式都会被拒绝执行：
#         python deploy/upload_dist.py              # 默认推到 /root/nginx/blog/colorai
#         python deploy/upload_dist.py --dry-run    # 空跑，只列文件不落盘
#         python deploy/upload_dist.py --clean      # 先清远端目录再推（同样受检查）
#       拒绝：目标是 /root/nginx/blog（漏了 /colorai）、叶子名是 front/admin/blog
#             （那是 blog 自己的目录）、路径以 / 结尾。想绕过要显式 --force。
#       ⚠️ 漏写 `/colorai` 的那个形式，正是会把 blog 的 front/ 和 admin/ **全删掉** 的写法。
#
# ============================ 三个必踩的坑 ============================
#   1) **`client_max_body_size` / `gzip` / 超时是 per-server 的，不继承！**
#      下面这几条只管 colorAI 自己。少写一条 = 传图 413 / 不压缩。
#      （同理见文末：certbot 追加的 443 块也不继承。）
#   2) **nginx 只在启动时解析一次上游域名。** go-backend 每次重建都会换 IP，
#      直接写 `proxy_pass http://go-backend:3001` 会表现为「后端起着却一直 502」。
#      必须用「变量 + resolver」强制定期重解析（见下面 location /api/）。
#   3) 本容器里**只有这一个 server 块**，所以它天然是默认块 ——
#      即使 Host 头不匹配（比如直接用 IP:8080 访问），也仍然会落到 colorAI，
#      不会像 blog 那样掉进 nginx 欢迎页。这点比共用 80 端口干净。
#
# ==========================================================================
#
# 前置条件（三项，缺一不可）：
#   1) 前端 dist 已就位 —— /root/nginx/blog/colorai/ 里有 index.html 与 assets/
#   2) 后端网络 colorai-net 已存在（`docker-compose up -d --build` 会创建）
#   3) ⚠️ **云控制台安全组放行 8080/tcp** —— 这一步只能你做，我在服务器上够不到。
#      没放行的话，服务器本机 curl 127.0.0.1:8080 是通的，但外面访问超时。

server {
    # 容器**内**监听 80；宿主机通过 `-p 8080:80` 暴露成 8080。
    # （这样以后要加 HTTPS，只需给这个容器加 `-p 8443:443` —— 重建它不影响 blog。）
    listen      80;
    server_name wzx.glaty.cn;

    # dist 在**容器内**的实际路径（宿主 /root/nginx/blog/colorai，只读挂进来）
    root  /usr/share/nginx/html/colorai;
    index index.html;

    # ⚠️ 必须。图片走 POST /api/chat 的 base64 dataURL（不是 multipart 上传），
    #    Go 侧 MAX_UPLOAD_BYTES=10MB 是「解码后」的字节数，base64 膨胀 4/3
    #    → 单个请求体约 13.7MB。Nginx 默认 client_max_body_size 1m，不放开必然 413。
    client_max_body_size 20m;

    # 前端产物是 gzip 收益最大的部分（主 JS 440KB → 116KB）
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    application/wasm image/svg+xml;

    # ---------------- 后端 API ----------------
    # nginx 与 go-backend 都在 colorai-net 上 → 按服务名直连，**不经过宿主机端口**，
    # 所以这里不能写 127.0.0.1（那是 nginx 容器自己）。
    location /api/ {
        # ⚠️ 为什么用「变量 + resolver」而不是直接写 proxy_pass http://go-backend:3001：
        #    见文件头「坑 2」。resolver 127.0.0.11 是 Docker 的内置 DNS，只有容器内可用。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $go_backend go-backend:3001;

        # 显式带上 $request_uri，避免「用了变量之后 URI 怎么传」的歧义：
        #   /api/chat → http://go-backend:3001/api/chat
        # Go 的路由本身就带 /api 前缀，不能在这里剥掉一层。
        proxy_pass http://$go_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 校色链路长：agent 调外部校色接口自身约 10s，config.py 给到 60s 超时
        # → 反代必须比下游更宽松，否则会先于后端断开、用户看到 504
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ---------------- PWA：Service Worker 与入口文件绝不缓存 ----------------
    # registerType: 'autoUpdate' 靠 sw.js 自身被重新拉取来触发更新；
    # 一旦被缓存，用户会长期卡在旧版本且无法自愈。
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ---------------- 带内容哈希的构建产物：可永久缓存 ----------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------------- SPA 路由回退 ----------------
    # /workspace 等是前端路由，刷新时没有对应文件，必须回退到 index.html，
    # 否则直接 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------- HTTPS ----------------
# 上 HTTPS 时**只动这个容器**，不碰 blog：
#   1) 重建 colorai-nginx，加上 `-p 8443:443`（以及证书挂载）
#   2) certbot 会在**本文件**里追加一个 443 server 块
# ⚠️ certbot 追加的块**不会**继承上面的 client_max_body_size / location 规则 ——
#    它只复制 server_name 和 root。所以 443 那个块里必须**再写一遍**：
#      client_max_body_size 20m;
#      location /api/ { ... }      # 含 resolver / set / proxy_pass
#      location / { try_files $uri $uri/ /index.html; }
#    否则「http 能传图、https 传图 413」这种问题会非常难查。

