services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colorai-agent
    ports:
      - "8000:8000"
    # .env 在「运行时」注入，而不是烘进镜像（.dockerignore 已排除 .env）。
    # required: false 让没有 .env 时也能启动（config.py 每项都有安全默认值），
    # 需要 Compose >= 2.24。
    env_file:
      - path: .env
        required: false
    environment:
      # environment 优先级高于 env_file，这里只放需要「按环境覆盖」的项。
      #
      # ⚠️ 不要在这里写 - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}：
      #    宿主 shell 未设置该变量时，Compose 会传入「空字符串」，
      #    而空字符串会盖掉 env_file 里的真 key。
      #    原来的写法之所以没炸，只是因为 agent/.env 恰好能被 Compose
      #    当作插值源读到 —— 换个目录运行就会踩到。
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}   # 旧的 deepseek-chat 已于 2026-07-24 停用
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./logs:/app/logs
      # RAG 用 BGE 模型缓存（见 doc/RAG知识库设计.md §4.6.3）
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      # 用 python 而不是 curl：基础镜像 python:3.11-slim 是否自带 curl 未经验证，
      # 不依赖外部命令可以消除这个不确定性。
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
